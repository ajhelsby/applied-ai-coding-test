[project]
name = "applied-ai-coding-test"
version = "0.1.0"
description = "Applied AI coding test project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pre-commit>=3.8,<4.0",
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "alembic>=1.13,<2.0",
  "redis>=5.2,<6.0",
]

[tool.uv]
dev-dependencies = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "coverage>=7.6,<8.0",
  "ruff>=0.6,<1.0",
  "black>=24.8,<25.0",
  "isort>=5.13,<6.0",
  "mypy>=1.11,<2.0",
  "types-redis>=4.6,<5.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["*/test*"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
