name: Lint and Test
description: Lint everything then run the API entry-point tests

runs:
  using: composite

  steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Setup pre-commit cache
      if: ${{ inputs.namespace_runners == 'true' }}
      uses: namespacelabs/nscloud-cache-action@v1
      with:
        path: |
          ~/.cache/pre-commit
          ~/.cache/uv

    - name: Install uv and dependencies
      run: |
        pip install uv
        uv sync
      shell: bash

    - name: Run Linters
      run: |
        uv run pre-commit run --all-files
      shell: bash

    - name: Run API entry-point tests
      env:
        PYTHONPATH: .
        DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/applied_ai_db
      run: uv run pytest -q tests/unit
      shell: bash
