name: Docker Compose E2E Tests

on:
  push:
    branches:
      - release-please--branches--main

permissions:
  contents: read

jobs:
  docker-compose-test:
    name: Docker Compose E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install uv and dependencies
        run: |
          pip install uv
          uv sync

      - name: Run Docker Compose tests
        env:
          PYTHONPATH: .
        run: uv run pytest -q tests/docker

      - name: Collect Docker diagnostics
        if: ${{ failure() }}
        run: |
          docker compose -f docker/docker-compose.yml ps
          docker ps -a

      - name: Tear down Docker Compose environment
        if: ${{ always() }}
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans
